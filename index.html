<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Mason Chen — Portfolio</title>
    <meta name="description" content="Mason Chen's portfolio: Mac apps, NumWorks calculator games, and 3D-printable designs." />
    <meta name="author" content="Mason Chen" />
    <link rel="canonical" href="https://masn.studio" />

    <!-- Open Graph / Social previews (X falls back to these for its card) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://masn.studio" />
    <meta property="og:title" content="Mason Chen — Portfolio" />
    <meta property="og:description" content="Mason Chen's portfolio: Mac apps, NumWorks calculator games, and 3D-printable designs." />
    <meta property="og:image" content="https://masn.studio/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data: ties the name to its profiles in search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mason Chen",
        "url": "https://masn.studio",
        "sameAs": [
          "https://github.com/Mason363",
          "https://makerworld.com/en/@roboting"
        ]
      }
    </script>
  </head>
  <body>
    <!-- Rotation root: rotated 90deg on portrait devices to force landscape -->
    <div id="rotation-root">
      <!-- Background CRT particle grain and ASCII trail canvas -->
      <canvas id="bg-canvas"></canvas>

      <!-- Custom Snapping Block Cursor -->
      <div id="terminal-cursor"></div>

      <!-- Master Viewport Container -->
      <div id="app-viewport">
      <div id="scroll-wrapper">
        
        <!-- STAGE 1: THE COMMAND -->
        <section id="stage-1" class="stage">
          <div class="stage-content">
            <div class="command-line" aria-hidden="true">
              <span class="prompt-char">%</span><span class="space-char">&nbsp;</span><span id="typewriter-text"></span>
            </div>
          </div>
        </section>

        <!-- STAGE 2: THE OUTPUT -->
        <section id="stage-2" class="stage">
          <div class="stage-content">
            <!-- Accessible off-screen title -->
            <h1 class="sr-only">Mason Chen</h1>
            
            <!-- Three.js Canvas for 3D tactile letters of MASON CHEN -->
            <div id="three-canvas-container"></div>
            
            <!-- Stage 2 Links: terminal-style listing (vertical stack under the letters).
                 Entry order must match the LINKS table in main.js. -->
            <div class="links-line">
              <div class="links-list">
                <div class="link-wrapper">
                  <a href="https://github.com/Mason363" target="_blank" rel="noopener noreferrer" class="terminal-link" data-link="github">github</a>
                </div>
                <div class="link-wrapper">
                  <a href="https://makerworld.com/en/@roboting" target="_blank" rel="noopener noreferrer" class="terminal-link" data-link="makerworld">makerworld</a>
                </div>
                <div class="link-wrapper">
                  <a href="https://coast.masn.studio" target="_blank" rel="noopener noreferrer" class="terminal-link" data-link="coast">coast</a>
                </div>
                <div class="link-wrapper">
                  <a href="https://tactile.masn.studio" target="_blank" rel="noopener noreferrer" class="terminal-link" data-link="tactile">tactile</a>
                </div>
                <div class="link-wrapper">
                  <a href="https://pathstitch.masn.studio" target="_blank" rel="noopener noreferrer" class="terminal-link" data-link="pathstitch">pathstitch</a>
                </div>
                <div class="link-wrapper">
                  <a href="https://mason363.github.io/NumPlay/" target="_blank" rel="noopener noreferrer" class="terminal-link" data-link="numplay">numplay</a>
                </div>
              </div>

              <!-- Contact: styled like the links, pinned to the right end of the
                   listing's last row. Also driven by the grid cursor in main.js. -->
              <div class="contact-wrapper">
                <a href="mailto:masonchen204@gmail.com" class="terminal-link contact-button">contact me</a>
              </div>
            </div>
          </div>
        </section>

        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
